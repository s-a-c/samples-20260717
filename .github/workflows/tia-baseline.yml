name: TIA Baseline

on:
  push:
    branches: [main, develop]
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

env:
  DB_HOST: 127.0.0.1
  DB_PORT: 5432
  DB_POOLED: "false"
  DB_DIRECT_HOST: 127.0.0.1
  DB_DIRECT_PORT: "5432"
  DB_DATABASE: testing_db
  DB_USERNAME: postgres
  DB_PASSWORD: secret

permissions:
  contents: read
  actions: write

jobs:
  baseline:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg18
        env:
          POSTGRES_DB: testing_db
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: secret
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --restart unless-stopped

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.5"
          extensions: pgsql, pcov
          coverage: pcov
          tools: composer

      - name: Install Composer dependencies
        env:
          COMPOSER_AUTH: ${{ secrets.COMPOSER_AUTH }}
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Build frontend assets
        run: pnpm run build

      - name: Configure application and database
        run: |
          cp .env.example .env
          php artisan key:generate --force
          {
            echo "DB_CONNECTION=pgsql"
            echo "DB_HOST=${{ env.DB_HOST }}"
            echo "DB_PORT=${{ env.DB_PORT }}"
            echo "DB_DATABASE=${{ env.DB_DATABASE }}"
            echo "DB_USERNAME=${{ env.DB_USERNAME }}"
            echo "DB_PASSWORD=${{ env.DB_PASSWORD }}"
          } >> .env
          php artisan config:clear --no-interaction
          php artisan route:clear --no-interaction

      - name: Record TIA baseline
        run: vendor/bin/pest --parallel --tia --coverage --fresh

      - name: Resolve TIA baseline path
        id: baseline
        run: echo "path=$(vendor/bin/pest --baseline)" >> "$GITHUB_OUTPUT"

      - name: Upload TIA baseline
        uses: actions/upload-artifact@v7
        with:
          name: pest-tia-baseline
          path: ${{ steps.baseline.outputs.path }}
          include-hidden-files: true
          retention-days: 30
